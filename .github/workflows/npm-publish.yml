name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted publishing needs id-token: write so GitHub can hand npm an OIDC
# token that proves the workflow is running in this specific repo. No
# NPM_TOKEN secret is required with this setup.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Publish
        run: npm publish --access public
